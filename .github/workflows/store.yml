name: Store

# On a merge to main, an app whose package.json version changed is tested, zipped for the store,
# tagged `<app>@<version>` with a GitHub release, and submitted to the Chrome Web Store.
# Only apps named in the repo variable CWS_AUTO_PUBLISH (for example `rekord klipkord`) go to the store.
on:
  push:
    branches: [main]
    paths: ['apps/*/package.json']

permissions:
  contents: write

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find apps with a new version
        id: find
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          apps=()
          for dir in apps/*/; do
            app=$(basename "$dir")
            now=$(node -p "require('./apps/$app/package.json').version")
            was=$(git show "$BEFORE:apps/$app/package.json" 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || true)
            if [ "$now" = "$was" ]; then continue; fi
            if git ls-remote --exit-code --tags origin "refs/tags/$app@$now" >/dev/null; then
              echo "$app@$now is already released."
              continue
            fi
            echo "$app: ${was:-new} -> $now"
            apps+=("$app")
          done
          echo "apps=$(printf '%s\n' "${apps[@]}" | node -e "console.log(JSON.stringify(require('fs').readFileSync(0,'utf8').split('\n').filter(Boolean)))")" >> "$GITHUB_OUTPUT"

  release:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -F "$APP" test
      - name: Zip
        run: pnpm -F "$APP" zip:store
      - name: Check zip
        id: pack
        run: |
          version=$(node -p "require('./apps/$APP/package.json').version")
          built=$(node -p "require('./apps/$APP/.output/chrome-mv3/manifest.json').version")
          if [ "$built" != "$version" ]; then
            echo "::error::Built manifest version '$built' does not match package.json '$version'."
            exit 1
          fi
          zip=$(ls apps/"$APP"/.output/*-chrome.zip | head -n 1)
          if unzip -Z1 "$zip" | grep -qiE '\.pem$'; then
            echo "::error::The store zip holds a key file. It must not."
            exit 1
          fi
          if unzip -p "$zip" manifest.json | node -e "process.exit('key' in JSON.parse(require('fs').readFileSync(0,'utf8'))?0:1)"; then
            echo "::error::The store zip's manifest has a key field. Build it with zip:store."
            exit 1
          fi
          {
            echo "tag=$APP@$version"
            echo "zip=$zip"
          } >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
      - name: Chrome Web Store
        env:
          AUTO: ${{ vars.CWS_AUTO_PUBLISH }}
          ZIP: ${{ steps.pack.outputs.zip }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          case " $AUTO " in
            *" $APP "*) .github/scripts/cws-publish.sh "$APP" "$ZIP" ;;
            *) echo "$APP is not in CWS_AUTO_PUBLISH. Upload the zip from the GitHub release by hand." ;;
          esac
