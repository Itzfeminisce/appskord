<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>View file frame</title>
    <style>html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; display: block; }</style>
  </head>
  <body>
    <iframe id="view" title="View file"></iframe>
    <!-- Sandboxed so the view file's inline script may run; extension pages forbid inline scripts. -->
    <script>
      // The file's frame gets its own opaque origin, so a reporter added at its end posts the result back.
      const REPORTER = '<script>addEventListener("load", async () => {'
        + 'const images = [...document.images]; await Promise.all(images.map((i) => i.decode().catch(() => undefined)));'
        + 'parent.postMessage({ type: "rendered", cards: Number(document.documentElement.dataset.cards || 0), images: images.filter((i) => i.naturalWidth > 0).length }, "*");'
        + '});</' + 'script>';
      let started = 0;
      addEventListener('message', (event) => {
        const data = event.data || {};
        if (data.type === 'show' && event.source === parent) {
          started = performance.now();
          document.getElementById('view').srcdoc = data.html.replace(/<\/body>\s*<\/html>\s*$/, REPORTER + '</body></html>');
        } else if (data.type === 'rendered') {
          parent.postMessage({ type: 'shown', cards: data.cards, images: data.images, ms: performance.now() - started }, '*');
        }
      });
    </script>
  </body>
</html>
