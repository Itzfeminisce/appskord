name: Release

# Tag `<app>@<version>` (for example `motikord@1.2.0`) ships that app alone.
# Tag `<app>@<version>-test` is a dry run: GitHub prerelease, no store upload.
# Manual run with an `app` input builds and zips only; the zip is a workflow artifact.
# The build job has no secrets and a read-only token. The publish job waits for approval
# in the chrome-web-store environment and runs no install.
on:
  push:
    tags: ['*@*']
  workflow_dispatch:
    inputs:
      app:
        description: App folder under apps/. Dry run only, tests build zip and artifact
        required: true
        type: choice
        options: [rekord, klipkord, motikord, briefkord]

permissions: {}

concurrency:
  group: release-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      EVENT: ${{ github.event_name }}
      TAG: ${{ github.ref_name }}
      INPUT_APP: ${{ inputs.app }}
    outputs:
      app: ${{ steps.meta.outputs.app }}
      dry: ${{ steps.meta.outputs.dry }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Parse tag
        id: meta
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            app="$INPUT_APP"; tag_version=""; dry=true
          else
            app="${TAG%@*}"; tag_version="${TAG#*@}"; dry=false
            case "$tag_version" in *-test) dry=true ;; esac
            case "${tag_version%-test}" in
              [0-9]*.[0-9]*.[0-9]*) ;;
              *) echo "::error::Version in '$TAG' must look like 1.2.3 or 1.2.3-test."; exit 1 ;;
            esac
          fi
          case "$app" in
            *[!a-z0-9-]*|"") echo "::error::Bad app name in '$TAG'. Use <app>@<version>."; exit 1 ;;
          esac
          if [ ! -d "apps/$app" ]; then
            echo "::error::apps/$app does not exist. Tag '$TAG' must be <app>@<version> for a folder under apps/."
            exit 1
          fi
          {
            echo "app=$app"
            echo "tag_version=$tag_version"
            echo "version=${tag_version%-test}"
            echo "dry=$dry"
          } >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm -F "${{ steps.meta.outputs.app }}" test
      - name: Zip
        run: pnpm -F "${{ steps.meta.outputs.app }}" zip:store
      - name: Check version and find zip
        env:
          APP: ${{ steps.meta.outputs.app }}
          WANT: ${{ steps.meta.outputs.version }}
        run: |
          built=$(node -p "require('./apps/$APP/.output/chrome-mv3/manifest.json').version")
          if [ -n "$WANT" ] && [ "$built" != "$WANT" ]; then
            echo "::error::Tag version '$WANT' does not match the built manifest version '$built'. Bump apps/$APP/package.json, merge to main, then tag again."
            exit 1
          fi
          zip=$(ls apps/"$APP"/.output/*-chrome.zip | head -n 1)
          mkdir -p dist
          cp "$zip" "dist/$APP-$built-chrome.zip"
          echo "Built $zip (manifest $built)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.meta.outputs.app }}-zip
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: chrome-web-store
    permissions:
      contents: write
    env:
      APP: ${{ needs.build.outputs.app }}
      DRY: ${{ needs.build.outputs.dry }}
      TAG: ${{ github.ref_name }}
    steps:
      # Only the publish script, from the tagged commit. No install, no tests, nothing from the build runner.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.build.outputs.app }}-zip
          path: dist
      # Checked here, not in the build job, so a tampered build runner cannot skip the check.
      - name: Check zip
        id: pack
        run: |
          case "$APP" in *[!a-z0-9-]*|"") echo "::error::Bad app name."; exit 1 ;; esac
          zip=$(ls dist/"$APP"-*-chrome.zip)
          [ "$(echo "$zip" | wc -l)" = 1 ] || { echo "::error::Expected one zip in the artifact."; exit 1; }
          if unzip -Z1 "$zip" | grep -qiE '\.pem$'; then
            echo "::error::The store zip holds a key file. It must not."
            exit 1
          fi
          built=$(unzip -p "$zip" manifest.json | node -e "const m=JSON.parse(require('fs').readFileSync(0,'utf8'));if('key' in m){process.exit(2)}process.stdout.write(m.version)") || { echo "::error::The store zip's manifest has a key field. Build it with zip:store."; exit 1; }
          want="${TAG#*@}"; want="${want%-test}"
          if [ "$built" != "$want" ]; then
            echo "::error::Zip manifest version '$built' does not match tag '$TAG'."
            exit 1
          fi
          echo "zip=$zip" >> "$GITHUB_OUTPUT"
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIP: ${{ steps.pack.outputs.zip }}
        run: |
          flags=""
          if [ "$DRY" = "true" ]; then flags="--prerelease"; fi
          gh release create "$TAG" "$ZIP" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" --generate-notes $flags
      - name: Chrome Web Store upload
        if: needs.build.outputs.dry == 'false'
        env:
          ZIP: ${{ steps.pack.outputs.zip }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          if [ -z "$CWS_CLIENT_ID" ] || [ -z "$CWS_CLIENT_SECRET" ] || [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_PUBLISHER_ID" ]; then
            echo "Store secrets are not all set. Upload the zip by hand."
            exit 0
          fi
          .github/scripts/cws-publish.sh "$APP" "$ZIP"
