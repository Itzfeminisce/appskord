<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rekord machine check</title>
    <style>
      body { font: 14px/1.45 system-ui, sans-serif; margin: 24px; max-width: 900px; color: #111; background: #fff; }
      table { border-collapse: collapse; width: 100%; margin: 16px 0; }
      th, td { border: 1px solid #ccc; padding: 6px 8px; text-align: left; vertical-align: top; }
      .go { color: #0a6b2d; font-weight: 600; } .no-go { color: #b00020; font-weight: 600; } .busy { color: #8a5a00; }
      p.hint { color: #555; margin: 2px 0 0; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>Rekord machine check</h1>
    <p>Run each check, then press Copy results and paste the text back.</p>
    <button id="copy" type="button">Copy results</button>
    <span id="status" role="status"></span>
    <table>
      <thead><tr><th>Check</th><th>Target</th><th>Result</th><th>Go or No-go</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
